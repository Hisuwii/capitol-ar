<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CU AR Department Directory</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="ar-container">
  <div id="loading-overlay">
    <div class="spinner" id="spinner"></div>
    <p class="loading-title">CU AR Directory</p>
    <p class="loading-sub" id="loading-sub">Loading AR engine...</p>
    <div id="progress-wrap" style="width:220px;height:10px;background:rgba(255,255,255,0.1);border-radius:9px;overflow:hidden;margin:0.5rem auto;display:none">
      <div id="progress-bar" style="height:100%;width:0%;background:#4a9eff;border-radius:9px;transition:width 0.3s"></div>
    </div>
    <button id="start-ar-btn"
      style="display:none;margin-top:1.5rem;padding:0.9rem 2.4rem;
             background:#003366;color:#fff;border:2px solid #4a9eff;
             border-radius:2rem;font-size:1.1rem;font-weight:700;cursor:pointer">
      Tap to Start AR Camera
    </button>
    <a href="target.html"
       style="display:block;margin-top:0.9rem;color:#4a9eff;font-size:0.85rem;text-decoration:none;">
      &#128247; Show CU Logo for scanning
    </a>
  </div>
  <div id="scan-hint" class="hidden">
    <p>Point camera at the <strong>CU Logo</strong></p>
  </div>
</div>
<script>
(function () {
  var sub  = document.getElementById('loading-sub');
  var wrap = document.getElementById('progress-wrap');
  var bar  = document.getElementById('progress-bar');

  var startTime = Date.now();
  wrap.style.display = 'block';
  sub.textContent    = 'Downloading AR engine (1.8 MB)...';

  var fakeTimer = setInterval(function () {
    var elapsed = (Date.now() - startTime) / 1000;
    var pct = Math.min(90, Math.round((1 - Math.exp(-elapsed / 30)) * 100));
    bar.style.width = pct + '%';
    sub.textContent = 'Downloading AR engine... ' + pct + '%';
  }, 500);

  var s = document.createElement('script');
  s.src = 'assets/mindar-bundle.js';
  s.onload = async function () {
    clearInterval(fakeTimer);
    bar.style.width = '100%';
    sub.textContent = 'AR engine loaded. Loading logos...';
    try {
      var res = await fetch('data/departments.json', { cache: 'no-cache' });
      var all = await res.json();
      window.DEPARTMENTS = all.map(function (d) {
        return { id: d.id, code: d.code, name: d.name, logo_path: d.logo_path };
      });
    } catch (e) {
      sub.textContent = '❌ Failed to load department list. Reload page.';
      sub.style.color = '#ff6666';
      return;
    }
    var s2 = document.createElement('script');
    s2.src = 'js/ar-main.js?v=' + Date.now() + '';
    s2.onerror = function () {
      sub.textContent = '❌ Failed to load AR logic. Reload page.';
      sub.style.color = '#ff6666';
    };
    document.head.appendChild(s2);
  };
  s.onerror = function () {
    clearInterval(fakeTimer);
    sub.textContent = '❌ Failed to load AR engine. Reload page.';
    sub.style.color = '#ff6666';
  };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
