<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Capitol University AR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<meta name="theme-color" content="#0b0809">
</head>
<body>
<div id="ar-container">
  <div id="loading-overlay">
    <div class="intro">
      <header class="wordmark">
        <h1>Capitol University</h1>
        <p>Augmented Reality</p>
      </header>
      <p class="lead">Scan the CU logo to explore every college in 3D.</p>
      <div class="status"><div class="spinner" id="spinner"></div><span class="loading-sub" id="loading-sub">Loading AR engine…</span></div>
      <div id="progress-wrap" class="progress"><div id="progress-bar"></div></div>
      <button id="start-ar-btn" class="btn btn-primary">Start AR camera</button>
      <a href="target.html" class="btn btn-ghost">Show the CU logo to scan</a>
      <p class="eyebrow section-label">Or browse colleges</p>
      <div class="dept-grid" id="dept-grid"></div>
    </div>
  </div>
  <div id="scan-hint" class="hidden">
    <span>Point your camera at the <strong>CU logo</strong></span>
  </div>
</div>
<script>
(function () {
  var sub  = document.getElementById('loading-sub');
  var wrap = document.getElementById('progress-wrap');
  var bar  = document.getElementById('progress-bar');

  fetch('data/departments.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(function (all) {
    var grid = document.getElementById('dept-grid');
    all.forEach(function (d) {
      var a = document.createElement('a');
      a.className = 'dept-tile';
      a.href = 'department.html?id=' + d.id;
      var img = document.createElement('img');
      img.src = d.logo_path; img.alt = ''; img.loading = 'lazy';
      var t = document.createElement('div');
      var b = document.createElement('b'); b.textContent = d.code;
      var sp = document.createElement('span'); sp.textContent = d.name.replace(/^College of /, '');
      t.appendChild(b); t.appendChild(sp);
      a.appendChild(img); a.appendChild(t);
      grid.appendChild(a);
    });
  }).catch(function () {});

  var startTime = Date.now();
  wrap.style.display = 'block';
  sub.textContent    = 'Downloading AR engine (1.8 MB)…';

  var fakeTimer = setInterval(function () {
    var elapsed = (Date.now() - startTime) / 1000;
    var pct = Math.min(90, Math.round((1 - Math.exp(-elapsed / 30)) * 100));
    bar.style.width = pct + '%';
    sub.textContent = 'Downloading AR engine… ' + pct + '%';
  }, 500);

  var s = document.createElement('script');
  s.src = 'assets/mindar-bundle.js';
  s.onload = async function () {
    clearInterval(fakeTimer);
    bar.style.width = '100%';
    sub.textContent = 'AR engine loaded. Loading logos…';
    try {
      var res = await fetch('data/departments.json', { cache: 'no-cache' });
      var all = await res.json();
      window.DEPARTMENTS = all.map(function (d) {
        return { id: d.id, code: d.code, name: d.name, logo_path: d.logo_path };
      });
    } catch (e) {
      sub.textContent = '❌ Failed to load department list. Reload page.';
      sub.style.color = '#ff6666';
      return;
    }
    var s2 = document.createElement('script');
    s2.src = 'js/ar-main.js?v=' + Date.now() + '';
    s2.onerror = function () {
      sub.textContent = '❌ Failed to load AR logic. Reload page.';
      sub.style.color = '#ff6666';
    };
    document.head.appendChild(s2);
  };
  s.onerror = function () {
    clearInterval(fakeTimer);
    sub.textContent = '❌ Failed to load AR engine. Reload page.';
    sub.style.color = '#ff6666';
  };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
