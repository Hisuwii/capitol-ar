<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Department — CU AR Directory</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="dept-page">
<div class="dept-container">
  <button class="back-btn" onclick="history.length > 1 ? history.back() : (location.href = 'index.html')">&#8592; Back to Departments</button>
  <div class="dept-header">
    <img src="" alt="" class="dept-logo" id="dept-logo">
    <div class="dept-title">
      <span class="dept-code" id="dept-code"></span>
      <h1 id="dept-name">Loading...</h1>
    </div>
  </div>
  <div class="dept-card">
    <h2 class="card-label">About the Department</h2>
    <p id="dept-desc"></p>
  </div>
  <div class="dept-card">
    <h2 class="card-label">Programs Offered</h2>
    <ul class="programs-list" id="dept-programs"></ul>
  </div>
  <div class="dept-card">
    <h2 class="card-label" id="mascot-label">Department Mascot</h2>
    <div id="mascot-viewer">
      <div class="viewer-loading"><div class="spinner"></div><p>Loading 3D model...</p></div>
    </div>
    <p class="viewer-hint">Drag to rotate &nbsp;·&nbsp; Scroll or pinch to zoom</p>
  </div>
</div>
<script>
(async function () {
  var id = parseInt(new URLSearchParams(location.search).get('id'), 10);
  var depts;
  try {
    depts = await (await fetch('data/departments.json', { cache: 'no-cache' })).json();
  } catch (e) {
    document.getElementById('dept-name').textContent = 'Could not load department data.';
    return;
  }
  var dept = depts.find(function (d) { return d.id === id; });
  if (!dept) { location.replace('index.html'); return; }

  document.title = dept.name + ' — CU AR Directory';
  var logo = document.getElementById('dept-logo');
  logo.src = dept.logo_path;
  logo.alt = dept.code + ' Logo';
  document.getElementById('dept-code').textContent = dept.code;
  document.getElementById('dept-name').textContent = dept.name;
  document.getElementById('dept-desc').textContent = dept.description;
  var ul = document.getElementById('dept-programs');
  dept.programs.forEach(function (p) {
    var li = document.createElement('li');
    li.textContent = p;
    ul.appendChild(li);
  });
  document.getElementById('mascot-label').textContent = 'Department Mascot: ' + dept.mascot_name;

  var viewer = document.getElementById('mascot-viewer');
  viewer.dataset.mascot = dept.mascot_name;
  viewer.dataset.type = dept.mascot_type || '';

  function load(src) {
    return new Promise(function (ok, fail) {
      var s = document.createElement('script');
      s.src = src; s.onload = ok; s.onerror = fail;
      document.body.appendChild(s);
    });
  }
  try {
    await load('assets/three.min.js');
    await load('js/mascot-viewer.js');
  } catch (e) {
    viewer.innerHTML = '<div class="viewer-loading"><p style="color:#b89898">3D viewer unavailable</p></div>';
  }
})();
</script>
</body>
</html>
